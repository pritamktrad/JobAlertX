<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobAlertX | Free Government & Private Job Alerts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .ticker-wrap { width: 100%; overflow: hidden; background: #1e293b; color: white; }
        .ticker { display: inline-block; whitespace: nowrap; animation: ticker 25s linear infinite; }
        @keyframes ticker { 0% { transform: translate3d(100%, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div class="ticker-wrap py-2 text-sm">
        <div class="ticker">
            🚨 🔥 <strong>Latest Update:</strong> Free API Job Portal Connected Live! Check new vacancies below & apply directly.
        </div>
    </div>

    <header class="bg-blue-800 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide"><i class="fas fa-briefcase mr-2"></i>JobAlertX</h1>
            <div id="job-count" class="text-xs bg-blue-900 px-3 py-1.5 rounded-full font-semibold">Loading Live Jobs...</div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 max-w-6xl">
        <!-- Search Bar -->
        <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-6">
            <input type="text" id="search-input" onkeyup="filterJobs()" placeholder="Search jobs by title, company, or keyword..." class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>

        <!-- Ad Placeholder Spot 1 -->
        <div class="bg-gray-200 border-2 border-dashed border-gray-400 p-4 rounded-lg text-center text-gray-500 mb-6 text-xs font-semibold uppercase tracking-wider">
            [ Advertisement Space - Google AdSense Spot ]
        </div>

        <!-- Job Cards Container -->
        <div id="jobs-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="p-8 text-center col-span-2 text-gray-500">Fetching live job listings...</div>
        </div>
    </main>

    <script>
        // Free Adzuna API Integration
        async function fetchLiveJobs() {
            const container = document.getElementById('jobs-container');
            const countBadge = document.getElementById('job-count');

            // Free public endpoint demo credentials
            const appId = "c911b3e7";
            const appKey = "897c8d9dfd7008107ddbb2efd8d47b7e";
            const url = `https://api.adzuna.com/v1/api/jobs/in/search/1?app_id=${appId}&app_key=${appKey}&results_per_page=20`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                
                countBadge.innerText = `${data.results.length} Active Jobs`;
                container.innerHTML = '';

                data.results.forEach(job => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-5 rounded-lg shadow-sm border border-gray-200 hover:shadow-md transition flex flex-col justify-between job-card";
                    card.innerHTML = `
                        <div>
                            <div class="flex justify-between items-start">
                                <h3 class="font-bold text-lg text-blue-900 mb-1">${job.title}</h3>
                                <span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded font-medium">${job.category.label}</span>
                            </div>
                            <p class="text-sm font-semibold text-gray-700 mb-2"><i class="fas fa-building text-gray-400 mr-1"></i>${job.company.display_name}</p>
                            <p class="text-xs text-gray-500 mb-3"><i class="fas fa-map-marker-alt text-gray-400 mr-1"></i>${job.location.display_name}</p>
                            <p class="text-xs text-gray-600 line-clamp-2 mb-4">${job.description}</p>
                        </div>
                        <a href="${job.redirect_url}" target="_blank" class="block text-center bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-md text-sm transition">
                            Apply Now <i class="fas fa-external-link-alt text-xs ml-1"></i>
                        </a>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `<div class="p-4 text-center text-red-500 col-span-2">Unable to load live API jobs right now. Please refresh.</div>`;
            }
        }

        function filterJobs() {
            const input = document.getElementById('search-input').value.toLowerCase();
            const cards = document.getElementsByClassName('job-card');
            Array.from(cards).forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(input) ? "flex" : "none";
            });
        }

        document.addEventListener('DOMContentLoaded', fetchLiveJobs);
    </script>
</body>
</html>
